# Copy to config.yaml and edit. config.yaml is gitignored.

library_root: "C:/Users/ericl/Brimstone Energy/Library - Documents/R&D"

# Subfolders under library_root (created if missing)
folders:
  import: import
  import_form: import-form
  repository: repository
  duplicates: duplicates
  failed: failed
  logs: logs

crossref:
  # Required real mailbox for the CrossRef polite pool (not @example.com)
  mailto: "YOUR_NAME@yourcompany.com"
  timeout_seconds: 30
  max_retries: 3

# Skip PDFs modified more recently than this (OneDrive still writing)
settle_seconds: 60

naming:
  n_title_words: 6
  name_spacer: "_"
  title_spacer: "-"
  max_filename_length: 150
